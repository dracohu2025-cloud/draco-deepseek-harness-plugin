# MiniMax Music 3 layer for an official DeepSeek Harness profile.
# Install with:
#   dsh plugin --profile web add github:dracohu2025-cloud/draco-deepseek-harness-plugin#path:music
# Then boot:
#   dsh --profile web

- insert:
    - id: draco-music-gen
      name: draco-music-gen/music
      config:
        provider: none
        region: cn

    - id: draco-music-gen-ui
      name: draco-music-gen
