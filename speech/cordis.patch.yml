# Volcengine speech layer for an official DeepSeek Harness profile.
# Install with:
#   dsh plugin --profile web add github:dracohu2025-cloud/draco-deepseek-harness-plugin#path:speech
# Then boot:
#   dsh --profile web

- insert:
    - id: draco-speech-gen
      name: draco-speech-gen/speech
      config:
        provider: none

    - id: draco-speech-gen-ui
      name: draco-speech-gen
