# Volcengine Seedance 2.0 layer for an official DeepSeek Harness profile.
# Install with:
#   dsh plugin --profile web add github:dracohu2025-cloud/draco-deepseek-harness-plugin#path:seedance
# Then boot:
#   dsh --profile web

- insert:
    - id: draco-seedance-gen
      name: draco-seedance-gen/seedance
      config:
        provider: none

    - id: draco-seedance-gen-ui
      name: draco-seedance-gen
